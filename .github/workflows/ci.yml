name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Typecheck backend
        run: npm run typecheck -w backend

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test backend
        run: npm test -w backend

      - name: Test frontend
        working-directory: frontend
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_COGNITO_USER_POOL_ID: dummy
          VITE_COGNITO_CLIENT_ID: dummy
          VITE_API_ENDPOINT: https://dummy.execute-api.ap-northeast-1.amazonaws.com

  terraform:
    name: Terraform Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
